name: Schema projection parity

on:
  pull_request:
    paths:
      - 'src/schema_parity/**'
      - 'src/bin/declmig-schema-crosscheck.rs'
      - 'tests/schema_parity.rs'
      - 'contracts/schema-parity/**'
      - 'contracts/source-authority/**'
      - 'scripts/ci/validate_source_authority.py'
      - 'tests/test_source_authority.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.zpkg.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/schema-parity.yml'

permissions:
  contents: read

concurrency:
  group: schema-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PACKAGE_LOCK_SHA256: 415bcb3c9e68a8c61d3625cead1edf825b39cf0af34b4a9300a43190fbdf7966
      GENERATED_SCHEMA_SHA256: 54451a3428a52de34044e1a42d75087ccee58e5dc2fc253bee0da7ecee749791
    steps:
      - name: Check out the exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Prove exact-head execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Set up exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.90.0 --component rustfmt --component clippy
          rustup default 1.90.0
          test "$(rustc --version | awk '{print $2}')" = '1.90.0'

      - name: Validate source-authority and Zed package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_source_authority.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_source_authority.py' \
            -v
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          zed = tomllib.loads(Path('.zpkg.toml').read_text(encoding='utf-8'))
          tasks = json.loads(
              Path('contracts/schema-parity/zed-env.json').read_text(encoding='utf-8')
          )
          assert zed['package']['org'] == 'declarative-migrations'
          assert zed['package']['name'] == cargo['package']['name']
          assert zed['package']['version'] == cargo['package']['version']
          assert set(tasks['tasks']) == {'lock', 'install', 'generate'}
          PY

      - name: Resolve and verify the reviewed TypeSpec lock
        shell: bash
        working-directory: contracts/schema-parity
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          printf '%s  %s\n' "$PACKAGE_LOCK_SHA256" package-lock.json | sha256sum --check --strict
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the TypeSpec evidence envelope twice
        shell: bash
        working-directory: contracts/schema-parity
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/schema-parity-first"
          second="$RUNNER_TEMP/schema-parity-second"
          rm -rf "$first" "$second"
          ./node_modules/.bin/tsp compile main.tsp --output-dir "$first" --warn-as-error
          ./node_modules/.bin/tsp compile main.tsp --output-dir "$second" --warn-as-error
          diff -ru --no-dereference "$first" "$second"
          printf '%s  %s\n' \
            "$GENERATED_SCHEMA_SHA256" \
            "$first/declmig-schema-parity.json" \
            | sha256sum --check --strict
          python3 -m json.tool "$first/declmig-schema-parity.json" >/dev/null

      - name: Format, test, lint, and release-build the Rust comparator
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --locked --release --bin declmig-schema-crosscheck

      - name: Prove CI did not rewrite tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
