name: reconciled peer authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconciled-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.88.0 fmt --all -- --check
      - name: Test fail-closed release policy
        run: cargo +1.88.0 test --all-targets --all-features
      - name: Clippy
        run: cargo +1.88.0 clippy --all-targets --all-features -- -D warnings
