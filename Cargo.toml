[package]
name = "declmig-lib-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Canonical persistence contracts and ORM projection cross-checks for PostgreSQL and CockroachDB"
repository = "https://github.com/declarative-migrations/declmig-lib-core"

[features]
default = ["read-only"]
read-only = []
read-write = ["read-only"]
migrate = ["read-write"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[lints.rust]
unsafe_code = "forbid"
