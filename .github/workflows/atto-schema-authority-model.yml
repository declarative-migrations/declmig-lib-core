name: DPM six-lane authority source model
on:
  pull_request:
    paths:
      - 'formal/atto-schema/**'
      - '.github/workflows/atto-schema-authority-model.yml'
  workflow_dispatch:
jobs:
  bounded-authority:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node formal/atto-schema/authority_model.cjs
