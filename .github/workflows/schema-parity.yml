name: Freeze schema parity outputs through guarded PR lane
on:
  pull_request:
    paths:
      - 'src/schema_parity/**'
      - 'src/bin/declmig-schema-crosscheck.rs'
      - 'tests/schema_parity.rs'
      - 'contracts/schema-parity/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.zpkg.toml'
      - 'rust-toolchain.toml'
      - 'ci/schema-parity-final.yml'
      - '.github/workflows/schema-parity.yml'
      - '.github/workflows/schema-parity-freeze.yml'
permissions:
  contents: write
concurrency:
  group: schema-parity-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  freeze:
    if: >-
      github.repository == 'declarative-migrations/declmig-lib-core' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/den-3321-schema-projection-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install exact Zed CLI
        run: |
          cargo install --git https://github.com/zed-pkg/zed-cli.git --rev dbd63f1d87d12c2e8cb9a8c600fae9b79f94e559 --locked --root "$RUNNER_TEMP/declmig-zed"
          echo "$RUNNER_TEMP/declmig-zed/bin" >> "$GITHUB_PATH"
      - name: Generate, format, and verify deterministic review outputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          zed validate
          cargo generate-lockfile
          zed task --plan contracts/schema-parity/zed-env.json run lock --yes --no-cache
          zed task --plan contracts/schema-parity/zed-env.json run generate --yes --no-cache
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          rm -rf contracts/schema-parity/generated-second
      - name: Commit only the reviewed outputs and final read-only workflow
        run: |
          set -euo pipefail
          cp ci/schema-parity-final.yml .github/workflows/schema-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock contracts/schema-parity/package-lock.json src tests .github/workflows/schema-parity.yml
          git add -f -- contracts/schema-parity/generated-current/declmig-schema-parity.json
          git rm -- ci/schema-parity-final.yml .github/workflows/schema-parity-freeze.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(Cargo.lock|contracts/schema-parity/package-lock.json|contracts/schema-parity/generated-current/declmig-schema-parity.json|src/.*\.rs|tests/.*\.rs|ci/schema-parity-final\.yml|\.github/workflows/schema-parity\.yml|\.github/workflows/schema-parity-freeze\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'chore(DEN-3321): freeze schema parity locks and generated evidence'
          git push origin HEAD:refs/heads/codex/den-3321-schema-projection-parity
