[package]
org = "declarative-migrations"
name = "declmig-lib-core"
version = "0.2.0"
description = "Canonical persistence contracts and deterministic Diesel/SeaORM schema parity tooling"
license = "MIT"
keywords = ["postgresql", "cockroachdb", "diesel", "seaorm", "typespec", "json-schema"]

[package.repository]
vcs = "git"
url = "https://github.com/declarative-migrations/declmig-lib-core"

# Fleet coordination and contract admission are shared dependencies. Runtime
# provider choices (Fiducia, PostgreSQL advisory locks, Redis, Cloudflare DO)
# remain behind ores-locks-and-leases; Declarative Migrations must not import a
# concrete distributed lock provider directly.
[dependencies]
"oresoftware/ores-locks-and-leases" = "=0.1.1"
"oresoftware/ores-contracts" = "^0.1.0"

[targets.rust]
dir = "."
adapter = "rust"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --all-targets"
exclude = [
  "target/**",
  "contracts/schema-parity/node_modules/**",
  "contracts/schema-parity/generated-current/**",
  "contracts/schema-parity/generated-second/**",
  ".zed/**",
]

[install]
dir = ".vendor/.zed"
